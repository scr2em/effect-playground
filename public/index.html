<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Effect Playground</title>
<link rel="stylesheet" href="/style.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/loader.min.js"></script>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-title">Effect Playground</div>
      <div class="brand-sub">v4.0.0-rc.112 · learn by fixing and building</div>
    </div>
    <nav id="nav"></nav>
    <div class="sidebar-foot">
      <button id="scratch-btn" class="link">Scratchpad</button>
      <button id="reset-progress" class="link danger">Reset progress</button>
    </div>
  </aside>
  <main id="main">
    <div id="content"><p class="muted">Loading…</p></div>
  </main>
</div>
<script src="/app.js"></script>
</body>
</html>
